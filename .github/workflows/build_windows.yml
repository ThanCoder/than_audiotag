name: Build Windows Native Library

on:
  push:
    tags:
    - 'v*'

  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Clone TagLib
      shell: bash
      run: |
        git clone \
          --depth 1 \
          --branch v1.13.1 \
          https://github.com/taglib/taglib.git \
          taglib-src

    - name: Configure
      shell: bash
      run: |
        cmake \
          -S taglib-src \
          -B build \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_BINDINGS=ON \
          -DBUILD_TESTING=OFF \
          -DBUILD_EXAMPLES=OFF

    - name: Build
      shell: bash
      run: |
        cmake --build build --config MinSizeRel --parallel

    - name: Prepare DLL
      shell: pwsh
      run: |
        New-Item `
          -ItemType Directory `
          -Force `
          -Path release/windows/x86_64

        Copy-Item `
          build/bindings/c/MinSizeRel/tag_c.dll `
          release/windows/x86_64/tag.dll

    - name: Show files
      shell: pwsh
      run: |
        Get-ChildItem -Recurse release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: taglib-windows-x86_64
        path: release/
