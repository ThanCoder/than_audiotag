name: Build Windows Native Library

on:
  push:
    tags:
    - 'v*'

  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone TagLib
      shell: bash
      run: |
        git clone \
          --depth 1 \
          --branch v1.13.1 \
          https://github.com/taglib/taglib.git \
          taglib-src

    - name: Configure
      shell: bash
      run: |
        cmake \
          -S taglib-src \
          -B build \
          -G "Visual Studio 18 2026" \
          -A x64 \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_BINDINGS=ON \
          -DBUILD_TESTING=OFF \
          -DBUILD_EXAMPLES=OFF

    - name: Build
      shell: bash
      run: |
        cmake \
          --build build \
          --config MinSizeRel \
          --parallel

    - name: Find build outputs
      shell: pwsh
      run: |
        Write-Host "=== Static libraries ==="

        Get-ChildItem `
          -Path build `
          -Recurse `
          -Include *.lib,*.dll `
          | Select-Object FullName

    - name: Create release directory
      shell: pwsh
      run: |
        New-Item `
          -ItemType Directory `
          -Force `
          -Path release/windows/x86_64

    - name: Show TagLib C binding
      shell: pwsh
      run: |
        Get-ChildItem `
          -Path build `
          -Recurse `
          -Include tag_c.lib,libtag.lib `
          | Select-Object FullName

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: taglib-windows-x86_64-build
        path: |
          build/**/*.lib
