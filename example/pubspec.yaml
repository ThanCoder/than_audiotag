publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.0
dependencies:

  flutter:
    sdk: flutter

  than_audiotag:
    path: ../
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  android_libcpp_shared: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  integration_test:
